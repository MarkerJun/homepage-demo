  <style>
    :root{color-scheme:light;--ink:#193346;--muted:#5d707a;--paper:#f5f4ef;--line:#d8dfdb;--accent:#246b58}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;line-height:1.8}a{color:inherit}a:focus-visible{outline:3px solid #dc9b39;outline-offset:5px}
    .wrap{width:min(1100px,calc(100% - 48px));margin:auto}header{border-bottom:1px solid var(--line)}nav{display:flex;justify-content:space-between;align-items:center;padding:22px 0}.brand{font-weight:700;text-decoration:none;letter-spacing:2px}.nav-link{font-size:14px;text-underline-offset:6px}
    .hero{display:grid;grid-template-columns:1.4fr 1fr;gap:70px;padding:80px 0 64px;align-items:center}.eyebrow{color:var(--accent);font-size:12px;font-weight:700;letter-spacing:3px}h1{font-size:clamp(40px,6vw,68px);line-height:1.2;letter-spacing:-2px;margin:22px 0}h1 span{color:var(--accent)}.intro{max-width:540px;color:var(--muted);font-size:17px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}.button{display:inline-flex;align-items:center;justify-content:center;padding:11px 23px;border:1px solid var(--ink);border-radius:5px;text-decoration:none;font-size:14px;font-weight:600}.primary{background:var(--ink);color:white}.button:hover{background:var(--accent);border-color:var(--accent);color:white}
    .profile{border-left:2px solid var(--accent);padding:4px 0 4px 30px}.profile h2{font-size:16px;margin:0 0 18px}.profile p{font-size:14px;color:var(--muted);margin:12px 0}.profile strong{display:block;color:var(--ink);font-size:17px;font-weight:500}.skills{display:flex;gap:9px;flex-wrap:wrap;margin-top:23px}.skills span{border:1px solid var(--line);border-radius:30px;padding:3px 13px;font-size:12px}
    .resume{padding:36px 0 65px;border-top:1px solid var(--line)}.section-head{display:flex;justify-content:space-between;gap:20px;align-items:baseline;margin-bottom:22px}.section-head h2{font-size:26px;margin:0}.section-head p{margin:0;color:var(--muted);font-size:13px}.viewer{background:#e2e6e4;border:1px solid #cbd4cf;border-radius:7px;padding:18px}.viewer object{display:block;width:100%;height:850px;background:white}.fallback{padding:35px;line-height:2}.mobile-note{font-size:13px;color:var(--muted);margin-top:14px}footer{border-top:1px solid var(--line);padding:22px 0;color:var(--muted);font-size:12px}.foot{display:flex;justify-content:space-between;gap:15px}
    @media(max-width:700px){.wrap{width:calc(100% - 32px)}.hero{grid-template-columns:1fr;gap:32px;padding:44px 0}.profile{padding-left:20px}.section-head{display:block}.section-head p{margin-top:8px}.viewer{padding:6px}.viewer object{height:580px}.foot{flex-direction:column;gap:3px}h1{letter-spacing:-1px}.intro{font-size:15px}}
  </style>
</head>

  <main class="wrap">

      <aside class="profile" aria-label="个人简介"><h2>关于我 / ABOUT</h2><p>学习背景<strong>数字经济 · 统计与保险</strong></p><p>实践方向<strong>风险模型监控与业务数据分析</strong></p><p>研究兴趣<strong>机器学习与金融风险识别</strong></p><div class="skills" aria-label="技能"><span>Python</span><span>SQL</span><span>R</span><span>机器学习</span></div></aside>
    </section>

  </main>
  <footer><div class="wrap foot"><span>某同学 · 个人主页</span><span>本页仅展示脱敏后的学习与实践经历。</span></div></footer>
